# Pipeline CI/CD -- etapes 5 et 6 du projet.
#
# Ce pipeline tourne SANS AUCUNE CONFIGURATION : aucun secret a creer, rien a
# parametrer. GHCR s'authentifie avec le GITHUB_TOKEN fourni automatiquement.
# Pousse le code, il est vert.
#
# Le deploiement Kubernetes vit dans un workflow SEPARE
# (.github/workflows/deploy-k8s.yaml), declenche a la main : il exige un acces
# au cluster, et son absence ne doit pas faire echouer ce pipeline-ci.
#
# Grille de notation visee :
#   - "Integration continue et automatisation des tests"  (4 pts) -> job `quality`
#   - "Deploiement continu et integration Kubernetes"     (4 pts) -> jobs `build` + `deploy`
#   - "Conteneurisation et portabilite"                   (5 pts) -> publication en registry
#
# Ce fichier EST la configuration du pipeline, et il est versionne : c'est la
# contrainte d'Infrastructure-as-Code appliquee au CI/CD, exigee par le sujet.

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Registry : GHCR (GitHub Container Registry). Avantage decisif pour un projet
# d'ecole : l'authentification passe par le GITHUB_TOKEN automatique, donc
# AUCUN secret a configurer. Pour basculer sur Docker Hub, voir le README.
env:
  REGISTRY: ghcr.io

jobs:

  # ---------------------------------------------------------------------------
  # 1. CONTROLE QUALITE : lint + tests. Rien ne se construit si ca echoue.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest

    # Une vraie base PostgreSQL le temps du job : les tests qui en ont besoin
    # tournent pour de vrai, au lieu d'etre ignores.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        # Le job attend que la base soit VRAIMENT prete avant de demarrer.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Installer les dependances
        working-directory: app/backend
        run: pip install -r requirements-dev.txt

      - name: Appliquer le schema
        # Les migrations sont un pas SEPARE, jamais le demarrage de l'app.
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U tasks -d tasksdb -f app/db/init.sql

      - name: Analyse statique (ruff)
        working-directory: app/backend
        run: ruff check .

      - name: Tests (pytest)
        working-directory: app/backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: tasksdb
          DB_USER: tasks
          DB_PASSWORD: testpass
          APP_VERSION: ci-test
        run: pytest -v

  # ---------------------------------------------------------------------------
  # 2. BUILD ET PUBLICATION des deux images. Uniquement si la qualite passe.
  # ---------------------------------------------------------------------------
  build:
    name: Build et push des images
    runs-on: ubuntu-latest
    needs: quality
    # Sur une pull request on valide, on ne publie pas.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write          # necessaire pour pousser sur GHCR

    strategy:
      matrix:
        include:
          - component: backend
            context: app/backend
          - component: frontend
            context: app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Calculer le nom d'image en minuscules
        # PIEGE CLASSIQUE : GHCR refuse les majuscules dans un nom d'image,
        # alors que `github.repository` conserve la casse du depot. Un depot
        # nomme "Projet-DevOps" fait echouer le push sans cette conversion.
        id: name
        run: |
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Connexion a la registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La version affichee dans l'interface = le SHA du commit.
          # C'est ce qui rend le rolling update visible pendant la soutenance.
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Cache partage entre executions : des builds bien plus rapides.
          cache-from: type=gha
          cache-to: type=gha,mode=max
