apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tasks
spec:
  # NodePort : accessible directement sur l'IP des 2 VM, sans LoadBalancer.
  # Le sujet ne demande pas de "vrai" service de haute disponibilite.
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080        # http://<ip-d-une-VM>:30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/frontend:latest
          ports:
            - containerPort: 80
          env:
            # Aucune adresse figee dans l'image : la meme image tourne en
            # staging, en prod, et sur l'infra de n'importe quelle equipe SysOps.
            - name: BACKEND_URL
              value: http://backend:8000
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
