apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tasks
spec:
  # LoadBalancer : k3s embarque "servicelb", qui expose le service sur le
  # port 80 de chaque noeud. Fonctionne a l'identique en local avec k3d
  # (http://localhost) et sur de vraies VM k3s (http://<ip-du-noeud>).
  # Un NodePort est alloue en plus, d'ou la valeur fixee ci-dessous.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Repartit les 2 repliques sur des NOEUDS DIFFERENTS.
      # Sans cette contrainte, Kubernetes peut placer les deux sur la meme
      # machine -- et la perte de ce noeud couperait le service malgre les
      # 2 repliques. C'est ce qui rend la demonstration de resilience vraie.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: ghcr.io/chaimaberrahil99/projet-devops/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Aucune adresse figee dans l'image : la meme image tourne en
            # staging, en prod, et sur l'infra de n'importe quelle equipe SysOps.
            - name: BACKEND_URL
              value: http://backend:8000
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
