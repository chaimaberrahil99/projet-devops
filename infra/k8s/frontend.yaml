apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tasks
spec:
  # LoadBalancer : k3s embarque "servicelb", qui expose le service sur le
  # port 80 du noeud. L'application est donc sur http://localhost, et sur
  # http://<ip-de-la-machine> depuis le reseau.
  # Un NodePort est alloue en plus, d'ou la valeur fixee ci-dessous.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Repartirait les repliques sur des noeuds differents s'il y en avait
      # plusieurs. Le cluster n'ayant qu'un noeud, la contrainte est sans effet
      # ici -- `ScheduleAnyway` garantit qu'elle ne bloque jamais le
      # deploiement. Elle est conservee pour qu'un ajout de noeud soit
      # immediatement exploite, sans modification des manifests.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: ghcr.io/chaimaberrahil99/projet-devops/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Aucune adresse figee dans l'image : la meme image tourne en
            # staging, en prod, et sur l'infra de n'importe quelle equipe SysOps.
            - name: BACKEND_URL
              value: http://backend:8000
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
