# Auto-scaling (etape 7).
#
# PREREQUIS : metrics-server doit etre installe sur le cluster, sinon l'HPA
# reste bloque sur "<unknown>". C'est le point a verifier AVEC l'equipe SysOps,
# et a installer cote Ansible. Verification :  kubectl top pods -n tasks
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: tasks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 70 % de la `requests` cpu (50m), soit ~35m par pod.
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30     # reagit vite a une montee en charge
    scaleDown:
      stabilizationWindowSeconds: 300    # redescend lentement, pour eviter
                                         # un yoyo de pods
