# Cluster k3s local MULTI-NOEUDS, avec k3d.
#
# k3d lance k3s dans des conteneurs Docker : un serveur et deux agents, chacun
# avec son propre kubelet. Kubernetes les traite comme des machines distinctes,
# donc la planification, la repartition des pods et la vidange d'un noeud
# fonctionnent reellement.
#
# A dire tel quel au jury : ce sont des conteneurs, pas des machines
# virtuelles, mais la distribution est bien k3s et le cluster est
# authentiquement multi-noeuds. Le passage a de vraies VM ne change que le
# support : les manifests et les commandes restent identiques.
#
# Creation :
#   k3d cluster create --config infra/k8s/k3d-cluster.yaml
# Verification :
#   kubectl get nodes          # 3 noeuds
# Suppression :
#   k3d cluster delete projet-devops

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: projet-devops

servers: 1     # plan de controle : API, ordonnanceur, etat du cluster
agents: 2      # noeuds de travail : c'est la que tournent vos pods

ports:
  # L'application, exposee par le service de type LoadBalancer de k3s.
  - port: 80:80
    nodeFilters: [loadbalancer]
  # Grafana.
  - port: 3000:3000
    nodeFilters: [loadbalancer]

options:
  k3s:
    extraArgs:
      # Traefik est installe par defaut par k3s. On n'en a pas besoin ici
      # (Nginx fait deja le routage dans le frontend) et il consomme de la
      # memoire. On garde en revanche servicelb, qui fournit les services
      # de type LoadBalancer.
      - arg: --disable=traefik
        nodeFilters: [server:*]
