# Grafana : visualise les metriques collectees par Prometheus.
#
# Le tableau de bord et la source de donnees sont "provisionnes" : ils sont
# decrits dans des fichiers, appliques au demarrage, et versionnes dans Git.
# Personne n'a donc a recliquer dans l'interface apres un redeploiement --
# c'est l'Infrastructure-as-Code appliquee a la supervision.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: projet-devops
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sre
  namespace: monitoring
data:
  signaux-sre.json: |
    {
      "uid": "signaux-sre",
      "title": "Projet DevOps - les 4 signaux SRE",
      "tags": [
        "sre",
        "projet-devops"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Trafic - requetes par seconde",
          "type": "timeseries",
          "description": "Combien de requetes l'application recoit. Signal SRE : trafic.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{app=\"backend\",endpoint!~\"/health.*|/metrics\"}[2m])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "title": "Erreurs - proportion de reponses 5xx",
          "type": "timeseries",
          "description": "Part des requetes en echec. Signal SRE : erreurs. Le clamp_min evite une division par zero quand il n'y a aucun trafic.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{app=\"backend\",status=~\"5..\"}[2m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{app=\"backend\"}[2m])), 0.001)",
              "legendFormat": "taux d'erreur",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "title": "Latence - 95e centile",
          "type": "timeseries",
          "description": "95 % des requetes sont plus rapides que cette valeur. Signal SRE : latence. On prend un centile et non une moyenne, car une moyenne masque les requetes lentes.",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app=\"backend\",endpoint!~\"/health.*|/metrics\"}[2m])) by (le, endpoint))",
              "legendFormat": "{{endpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "title": "Saturation - processeur par pod",
          "type": "timeseries",
          "description": "Consommation processeur des conteneurs, mesuree par cAdvisor. Signal SRE : saturation. C'est cette valeur qui declenche l'auto-scaling.",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"tasks\",container!=\"\"}[2m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alertes
  namespace: monitoring
data:
  alertes.yaml: |
    # Alertes Grafana, decrites en YAML et versionnees.
    #
    # Un tableau de bord suppose quelqu'un devant l'ecran. Une alerte, non : c'est
    # ce qui transforme des metriques en supervision.
    #
    # Une regle par signal SRE. Chacune compare une requete Prometheus (A) a un
    # seuil (B), et ne se declenche que si la condition tient pendant la duree
    # indiquee par `for` -- ce qui evite les alertes sur un pic isole.
    #
    # Comme la source de donnees et le tableau de bord, ces regles sont appliquees
    # au demarrage de Grafana : rien n'est configure a la main dans l'interface.
    #
    # A voir dans Grafana :  Alerting > Alert rules

    apiVersion: 1
    groups:
    - orgId: 1
      name: signaux-sre
      folder: Alertes
      interval: 1m
      rules:
      - uid: sre-erreurs
        title: Taux d'erreur eleve
        condition: B
        for: 2m
        isPaused: false
        noDataState: OK
        execErrState: Error
        labels:
          severite: critique
        annotations:
          summary: Plus de 5 % des requetes echouent
          description: 'Les utilisateurs sont affectes maintenant. Verifier les journaux
            du backend : kubectl logs -n tasks -l app=backend --tail=50'
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            editorMode: code
            expr: (sum(rate(http_requests_total{app="backend",status=~"5.."}[5m])) or
              vector(0)) / clamp_min(sum(rate(http_requests_total{app="backend"}[5m])),
              0.001)
            instant: true
            range: false
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.05
              operator:
                type: and
              query:
                params:
                - A
              reducer:
                type: last
                params: []
              type: query
      - uid: sre-latence
        title: Latence trop elevee
        condition: B
        for: 5m
        isPaused: false
        noDataState: OK
        execErrState: Error
        labels:
          severite: avertissement
        annotations:
          summary: Le 95e centile depasse 500 ms
          description: Le service repond encore mais lentement. Cinq minutes d'attente
            avant declenchement, pour ignorer les pics isoles.
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            editorMode: code
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app="backend",endpoint!~"/health.*|/metrics"}[5m]))
              by (le))
            instant: true
            range: false
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.5
              operator:
                type: and
              query:
                params:
                - A
              reducer:
                type: last
                params: []
              type: query
      - uid: sre-disponibilite
        title: Moins de deux pods backend
        condition: B
        for: 2m
        isPaused: false
        noDataState: Alerting
        execErrState: Error
        labels:
          severite: critique
        annotations:
          summary: Le backend n'a plus deux repliques pretes
          description: 'Le service repond peut-etre encore, mais il n''est plus protege
            contre la perte d''un pod. Verifier : kubectl get pods -n tasks'
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            editorMode: code
            expr: sum(up{app="backend"})
            instant: true
            range: false
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: lt
                params:
                - 2
              operator:
                type: and
              query:
                params:
                - A
              reducer:
                type: last
                params: []
              type: query
      - uid: sre-saturation
        title: Saturation processeur
        condition: B
        for: 2m
        isPaused: false
        noDataState: OK
        execErrState: Error
        labels:
          severite: avertissement
        annotations:
          summary: Un pod backend depasse 80 % de sa demande processeur
          description: Seuil a 0,04 coeur, soit 80 % des 50 millicores demandes. L'auto-scaling
            devrait avoir ajoute des repliques ; s'il ne le fait pas, c'est qu'il a atteint
            son maximum de six.
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            editorMode: code
            expr: max(rate(container_cpu_usage_seconds_total{namespace="tasks",container="backend"}[5m]))
            instant: true
            range: false
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.04
              operator:
                type: and
              query:
                params:
                - A
              reducer:
                type: last
                params: []
              type: query
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          ports:
            - containerPort: 3000
          env:
            # Consultation sans authentification : le sujet ecarte la partie
            # securite, et cela evite une fenetre de connexion pendant la
            # demonstration. Le compte admin reste disponible pour editer.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: alertes
              mountPath: /etc/grafana/provisioning/alerting
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-sre
        - name: alertes
          configMap:
            name: grafana-alertes
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  # LoadBalancer : k3s l'expose sur le port 3000 du noeud, donc sur
  # http://localhost:3000.
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
