# Promtail : le collecteur de logs.
#
# Il tourne en DaemonSet -- un exemplaire sur CHAQUE noeud du cluster. C'est
# necessaire parce que les fichiers de logs sont sur le disque du noeud :
# aucun pod central ne pourrait les lire a distance. Avec un noeud, il y a un
# exemplaire ; en ajouter un en lancerait un second automatiquement.
#
# Il demande a Kubernetes la liste des pods, en deduit le chemin de leurs
# fichiers de logs, les lit, et attache a chaque ligne les etiquettes qui
# permettront de la retrouver : namespace, pod, conteneur, application.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      log_level: info

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    # Configuration EXPLICITE plutot que decouverte automatique.
    #
    # La decouverte via l'API Kubernetes est plus elegante -- elle s'adapte
    # toute seule aux nouveaux pods -- mais elle depend d'une chaine de
    # relabeling et de droits qui, quand elle echoue, ne produit aucun message
    # d'erreur : juste zero cible et des tableaux de bord vides. On a prefere
    # declarer les trois chemins.
    #
    # Les fichiers vivent dans /var/log/pods/<namespace>_<pod>_<uid>/<conteneur>/
    # Le motif ci-dessous attrape donc tous les pods d'un meme Deployment,
    # repliques comprises, et continue de fonctionner quand ils sont recrees.
    scrape_configs:

      - job_name: backend
        static_configs:
          - targets: [localhost]
            labels:
              namespace: tasks
              app: backend
              __path__: /var/log/pods/tasks_backend-*/*/*.log
        pipeline_stages:
          # Decode le format de containerd : horodatage, flux, indicateur,
          # puis le message.
          - cri: {}

      - job_name: frontend
        static_configs:
          - targets: [localhost]
            labels:
              namespace: tasks
              app: frontend
              __path__: /var/log/pods/tasks_frontend-*/*/*.log
        pipeline_stages:
          - cri: {}

      - job_name: postgres
        static_configs:
          - targets: [localhost]
            labels:
              namespace: tasks
              app: postgres
              __path__: /var/log/pods/tasks_postgres-*/*/*.log
        pipeline_stages:
          - cri: {}

      - job_name: supervision
        static_configs:
          - targets: [localhost]
            labels:
              namespace: monitoring
              app: supervision
              __path__: /var/log/pods/monitoring_*/*/*.log
        pipeline_stages:
          - cri: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          securityContext:
            # Les fichiers de logs du noeud appartiennent a root, or l'image
            # de Promtail tourne par defaut sous un utilisateur non
            # privilegie : sans cela, il decouvre les pods mais ne peut pas
            # lire leurs fichiers, et les tableaux de bord restent vides.
            # C'est aussi ce que fait la chart Helm officielle.
            runAsUser: 0
            runAsGroup: 0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            # Les fichiers de logs du noeud, en lecture seule.
            - name: logs-pods
              mountPath: /var/log/pods
              readOnly: true
            - name: logs-conteneurs
              mountPath: /var/log/containers
              readOnly: true
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 192Mi }
      tolerations:
        # Pour qu'il tourne aussi sur un plan de controle, si le cluster en
        # compte un distinct un jour.
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: logs-pods
          hostPath:
            path: /var/log/pods
        - name: logs-conteneurs
          hostPath:
            path: /var/log/containers
