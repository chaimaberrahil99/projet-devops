# Promtail : le collecteur de logs.
#
# Il tourne en DaemonSet -- un exemplaire sur CHAQUE noeud du cluster. C'est
# necessaire parce que les fichiers de logs sont sur le disque du noeud :
# aucun pod central ne pourrait les lire a distance. Avec un noeud, il y a un
# exemplaire ; en ajouter un en lancerait un second automatiquement.
#
# Il demande a Kubernetes la liste des pods, en deduit le chemin de leurs
# fichiers de logs, les lit, et attache a chaque ligne les etiquettes qui
# permettront de la retrouver : namespace, pod, conteneur, application.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      # `info` et non `warn` : une collecte vide ne produit aucun avertissement,
      # donc sans ce niveau on ne voit rien du tout.
      log_level: info

    positions:
      # Memorise ou en est la lecture de chaque fichier, pour ne pas tout
      # renvoyer apres un redemarrage.
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Les logs de containerd ont un format particulier : horodatage,
          # flux, indicateur, puis le message. Cette etape les decode.
          - cri: {}
        relabel_configs:
          # Note : on ne filtre PAS par noeud. Le filtre habituel s'appuie sur
          # une variable d'environnement substituee dans ce fichier ; si la
          # substitution echoue, il rejette tout et les tableaux de bord
          # restent vides sans message d'erreur. Avec un seul noeud il est
          # inutile, et avec plusieurs les chemins des autres noeuds ne
          # correspondent simplement a aucun fichier local.

          # Etiquettes qui serviront a filtrer dans Grafana.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

          # Chemin reel des fichiers sur le noeud, deduit de l'identifiant du
          # pod et du nom du conteneur.
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          securityContext:
            # Les fichiers de logs du noeud appartiennent a root, or l'image
            # de Promtail tourne par defaut sous un utilisateur non
            # privilegie : sans cela, il decouvre les pods mais ne peut pas
            # lire leurs fichiers, et les tableaux de bord restent vides.
            # C'est aussi ce que fait la chart Helm officielle.
            runAsUser: 0
            runAsGroup: 0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            # Les fichiers de logs du noeud, en lecture seule.
            - name: logs-pods
              mountPath: /var/log/pods
              readOnly: true
            - name: logs-conteneurs
              mountPath: /var/log/containers
              readOnly: true
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 192Mi }
      tolerations:
        # Pour qu'il tourne aussi sur un plan de controle, si le cluster en
        # compte un distinct un jour.
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: logs-pods
          hostPath:
            path: /var/log/pods
        - name: logs-conteneurs
          hostPath:
            path: /var/log/containers
